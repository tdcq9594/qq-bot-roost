name: 发布指纹校验

# 什么时候跑：推 tag（v*）时。
#
# 为什么单独一个 workflow：CI 里的 `sums:check` 只看「当前版本有没有指纹条目」，
# 防的是「忘了跑 npm run sums」。但还有另一种翻车方式——跑了 sums 之后又改了代码，
# 指纹就和实际内容对不上了。那种情况会让所有用户的自动更新**校验失败**（有意的），
# 而且现象是「更新点了没反应」，很难查。
#
# tag 上的工作区正好就是将要发布的内容，所以在这里比对指纹最准。

on:
  push:
    tags:
      - 'v*'

jobs:
  verify:
    name: 指纹与发布内容一致
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: 指纹必须与当前代码一致
        run: npm run sums:verify

      - name: 版本号与 tag 一致
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          ver=$(node -p "require('./package.json').version")
          echo "tag = $tag, package.json = $ver"
          if [ "$tag" != "$ver" ]; then
            echo "tag 和 package.json 的版本号不一致，发布出去的包会自报错误版本"
            exit 1
          fi

  # 推 tag 自动建 GitHub Release——七步里的第⑤步交给机器，根治「只推 tag 没建 Release
  # 导致 releases/latest 停在旧版」。插件仓 ci.yml 现在从 releases/latest 取框架版本，
  # 漏建 Release 会让它一直测旧框架，所以这一步必须可靠。
  # needs: verify —— 指纹或版本号不对就不建，别把坏版本推到 latest。
  release:
    name: 建 GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 建 Release 需要；verify job 保持默认只读
    steps:
      - uses: actions/checkout@v4

      - name: 生成 Release 标题与正文
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          head_line=$(grep -m1 '^## v' RELEASE_NOTES.md || true)
          if [ -z "$head_line" ]; then
            echo "RELEASE_NOTES.md 里没有 '## vX.Y.Z：' 开头的段落" >&2
            exit 1
          fi
          notes_ver=$(printf '%s' "$head_line" | sed -nE 's/^## v([0-9.]+).*/\1/p')
          tag_ver="${tag#v}"
          if [ "$notes_ver" != "$tag_ver" ]; then
            echo "RELEASE_NOTES 顶部段是 v$notes_ver，tag 是 v$tag_ver——先把新版 notes 写到最上面" >&2
            exit 1
          fi
          title=$(printf '%s' "$head_line" | sed -E 's/^## (v[0-9.]+)：/\1 — /')
          printf 'RELEASE_TITLE=%s\n' "$title" >> "$GITHUB_ENV"
          # 正文取顶部段（第一个 ## v 到下一个 ## v 之前），对齐发版清单第 92 行
          awk '/^## v/{n++} n==1' RELEASE_NOTES.md > "$RUNNER_TEMP/release-body.md"

      - name: 建 Release（已存在则跳过，不覆盖人工内容）
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag 已存在，跳过（不覆盖人工内容）"
            exit 0
          fi
          gh release create "$tag" --title "$RELEASE_TITLE" --notes-file "$RUNNER_TEMP/release-body.md"
