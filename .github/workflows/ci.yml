name: CI

# 跑什么：语法检查 + 单元自检 + 端到端（e2e 自己起 mock 服务，不需要真 QQ）
#
# 注意 e2e 的设计前提：它必须能在**干净克隆**上全绿。
# 所以：
#   - 运行数据全在临时目录（ROOST_HOME），不碰仓库里的 config / data
#   - 端口是运行时挑的空闲端口，不和别的进程抢
#   - 示例插件在另一个仓库，本机没装时相关断言会 SKIP 而不是 FAIL
# 这三条任一被破坏，CI 就会变成一片红——改测试前先想清楚。

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.x', '24.x']

    steps:
      - uses: actions/checkout@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 打印环境
        run: |
          node -v
          npm -v

      - name: 语法检查（全部 js/mjs）
        shell: bash
        run: |
          fail=0
          for f in $(find src web test scripts sdk -type f \( -name '*.js' -o -name '*.mjs' \) 2>/dev/null); do
            node --check "$f" || { echo "语法错误: $f"; fail=1; }
          done
          exit $fail

      - name: 单元自检
        run: npm test

      # 只给「有专门单测」的三个模块设门禁（信任/清单/链路）。
      # 不给整个 src 设，是因为大部分代码由 selftest 覆盖，而 selftest 不是
      # node:test，混在一起算出来的数字没意义——宁要窄而真的门禁。
      - name: 覆盖率门禁（信任/清单/链路）
        run: npm run test:coverage

      - name: 端到端
        run: npm run test:e2e

      - name: 真机驱动自测（假 OneBot 服务端，不需要 QQ）
        run: node test/live-driver.mjs

  # 凭据泄露单独一个 job，而且跑得最早：真泄露了就别等测试跑完。
  #
  # 起因是 test/e2e.mjs 里硬编码过真实 AppSecret，仓库公开，等于凭证外泄。
  # 那种行看起来和「随便一个测试字符串」没区别，review 抓不住。
  secrets:
    name: 凭据扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: 不应有硬编码的 AppSecret / token
        run: node scripts/check-secrets.mjs

  # 更新指纹单独一个 job：发版忘了留指纹，用户的自动更新会被**拒绝**
  # （这是有意的严格模式，见 updater.js）。所以把「版本号一变就必须有指纹」
  # 做成硬门禁，靠机制不靠记性。
  #
  # 两级检查：
  #   ① 任何时候都查「当前版本有没有指纹条目」——防忘了跑 npm run sums；
  #   ② PR 里版本号比目标分支高时才查「指纹与内容一致」——防 bump 了、也跑过 sums，
  #      但之后又改了代码或 rebase 带进了别人的改动。
  #      ②不能无条件开：开发中代码一直在变而版本号没变，无条件比对会让 CI 天天红，
  #      最后大家都把它当噪音。
  sums:
    name: 更新指纹
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: 当前版本必须已有内容指纹
        run: npm run sums:check

      # strict=true 的分支保护要求 PR 先跟上目标分支，rebase 之后很容易出现
      # 「指纹是 rebase 前算的」——那种情况在这里红，比合并后在 master 上红好得多。
      - name: PR 里 bump 了版本 → 指纹必须与内容一致
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          cur=$(node -p "require('./package.json').version")
          git fetch --depth=1 origin "${{ github.base_ref }}" >/dev/null 2>&1
          base=$(git show FETCH_HEAD:package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          if [ "$cur" = "$base" ]; then
            echo "版本未变（$cur），本次不查指纹内容；发版 job 会在合并后再验一次"
            exit 0
          fi
          echo "版本 $base → $cur：校验指纹与内容是否一致"
          npm run sums:verify

  # README 的版本徽章是硬编码的（badge/version-x.y.z），发版 bump 了
  # package.json 却忘改徽章是老毛病（0.8.10 就漏过）——面板会一直显示旧版本。
  # 用 CI 把它和 package.json 绑死，漏改就红。dsh-roost 的徽章是 npm 动态徽章，
  # 不需要这类检查，所以只放在框架仓。
  badge:
    name: 版本徽章
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: README 版本徽章 == package.json 版本
        shell: bash
        run: |
          ver=$(node -p "require('./package.json').version")
          badge=$(grep -oE 'badge/version-[0-9]+\.[0-9]+\.[0-9]+' README.md | head -1 | sed -E 's/.*version-//')
          if [ -z "$badge" ]; then
            echo "::error::README.md 里找不到 badge/version-x.y.z 徽章" >&2
            exit 1
          fi
          if [ "$badge" != "$ver" ]; then
            echo "::error::README 版本徽章是 $badge，package.json 是 $ver——发版时一起改" >&2
            exit 1
          fi
          echo "OK：徽章与版本都是 $ver"

      # notes 顶部段版本对不上时，`release.yml` 会在**合并之后**才红——那时 PR 已经
      # 进了 master，发不出去，只能再提一个只修 notes 的 PR。所以把这条校验提前到
      # PR 阶段：本 PR 只要 bump 了版本，notes 顶部段就必须是这个版本。
      #
      # 判据和 sums job 的第二段一致（比较 base 与 head 的 package.json），不用
      # `release` 标签——`pull_request` 事件默认不含 `labeled`，打标签那次根本不会
      # 触发新 run，靠标签判会漏。
      #
      # 放在这个 job 里（而不是新建 job）是因为必需检查是按 check run 的 name 匹配的：
      # 新建 job 不在列表里只跑不拦，改名又会直接让必需检查失配。
      - name: bump 了版本 → notes 顶部段必须同步
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          cur=$(node -p "require('./package.json').version")
          git fetch --depth=1 origin "${{ github.base_ref }}" >/dev/null 2>&1
          base=$(git show FETCH_HEAD:package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          if [ "$cur" = "$base" ]; then
            echo "版本未变（$cur），不要求 notes 新段"
            exit 0
          fi
          head_line=$(grep -m1 '^## v' RELEASE_NOTES.md || true)
          if [ -z "$head_line" ]; then
            echo "::error::RELEASE_NOTES.md 里没有 '## vX.Y.Z：' 开头的段落" >&2
            exit 1
          fi
          notes_ver=$(printf '%s' "$head_line" | sed -nE 's/^## v([0-9.]+).*/\1/p')
          if [ "$notes_ver" != "$cur" ]; then
            echo "::error::RELEASE_NOTES 顶部段是 v$notes_ver，package.json 是 v$cur——把新版 notes 写到最上面（npm run release:prepare 会生成骨架）" >&2
            exit 1
          fi
          echo "OK：notes 顶部段 v$notes_ver == package.json"

  # 换行符单独一个 job：Windows 开发者本地检出是 CRLF，
  # 一不小心就提交进去，而这种问题在 Windows 上跑测试是看不出来的。
  eol:
    name: 换行符检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 代码文件不应含 CRLF
        shell: bash
        run: |
          bad=$(git grep -Il $'\r' -- 'src/**' 'web/**' 'test/**' 'scripts/**' 'docs/**' '*.md' '*.json' || true)
          if [ -n "$bad" ]; then
            echo "以下文件含 CRLF，请转成 LF："
            echo "$bad"
            exit 1
          fi
          echo "OK：没有 CRLF"
